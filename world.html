<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>StoryBloom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="step-label">
    STEP 2
</div>

<h1>🌎 世界を作ろう</h1>

<p>どんな場所にする？</p>

<div class="choices">

    <button class="card">
        <div class="emoji">🌳</div>
        <span>不思議な森</span>
        <small>秘密が眠る場所</small>
    </button>


    <button class="card">
        <div class="emoji">🏙</div>
        <span>現代の街</span>
        <small>いつもの日常</small>
    </button>


    <button class="card">
        <div class="emoji">🌙</div>
        <span>月の世界</span>
        <small>静かな宇宙</small>
    </button>


    <button class="card">
        <div class="emoji">🌊</div>
        <span>海の底</span>
        <small>知らない世界</small>
    </button>


    <button class="card">
        <div class="emoji">🏰</div>
        <span>魔法の国</span>
        <small>夢のような場所</small>
    </button>


    <button class="card">
        <div class="emoji">🚀</div>
        <span>宇宙</span>
        <small>未知への旅</small>
    </button>

</div>


<div class="idea-box">

    <p>💡 自分だけの世界を追加</p>

    <textarea 
        id="customWorld"
        placeholder="例：雲の上にある小さな街"></textarea>

</div>


<button class="next-button" id="worldNext">
    次へ
</button>

<script src="utils.js"></script>
<script src="world.js"></script>

</body>

</html>
