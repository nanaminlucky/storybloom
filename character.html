<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StoryBloom - 主人公づくり</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="step-label">
    STEP 1
</div>

<h1>🧑 主人公を作ろう</h1>

<p>
だれのお話にする？
</p>


<div class="choices">


<button class="card">

<div class="emoji">👧</div>

<span>子ども</span>

</button>


<button class="card">

<div class="emoji">🧑</div>

<span>大人</span>

</button>


<button class="card">

<div class="emoji">👵</div>

<span>お年寄り</span>

</button>


<button class="card">

<div class="emoji">🐱</div>

<span>動物</span>

</button>


<button class="card">

<div class="emoji">🧚</div>

<span>不思議な存在</span>

</button>


<button class="card">

<div class="emoji">🤖</div>

<span>AI・ロボット</span>

</button>


</div>



<div class="idea-box">


<p>
💡 主人公について自由に書いてね
</p>


<textarea 
id="characterIdea"
placeholder="例：誰にも言えない秘密を持つ猫"></textarea>


</div>



<button class="next-button" id="characterNext">

次へ

</button>



<script src="utils.js"></script>
<script src="character.js"></script>


</body>

</html>
