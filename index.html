<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>StoryBloom</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>📖 StoryBloom</h1>

    <p>わたしだけの、世界に1つのものがたり。
    <br> あなたの頭の中にある小さなアイデアを、AIと一緒にかたちにしよう。</p>

    <h2>🌈 どんな おはなし？</h2>

<div class="top-choices">

    <button class="card">
        <div class="emoji">🏰</div>
        <span>ファンタジー</span>
        <small>ふしぎな世界</small>
    </button>

    <button class="card">
        <div class="emoji">⚔️</div>
        <span>冒険</span>
        <small>未知への旅</small>
    </button>

    <button class="card">
        <div class="emoji">🔎</div>
        <span>ミステリー</span>
        <small>なぞを解く</small>
    </button>

    <button class="card">
        <div class="emoji">🚀</div>
        <span>SF</span>
        <small>未来と科学</small>
    </button>

    <button class="card">
        <div class="emoji">💕</div>
        <span>恋愛</span>
        <small>ラブストーリー</small>
    </button>

    <button class="card">
        <div class="emoji">🌱</div>
        <span>成長</span>
        <small>変化する物語</small>
    </button>

    <button class="card">
        <div class="emoji">🌙</div>
        <span>ホラー</span>
        <small>こわいお話</small>
    </button>

    <button class="card">
        <div class="emoji">🏯</div>
        <span>歴史</span>
        <small>むかしの時代へ</small>
    </button>

    <button class="card">
        <div class="emoji">🌿</div>
        <span>日常</span>
        <small>小さな出来事</small>
    </button>

    <button class="card">
        <div class="emoji">📝</div>
        <span>エッセイ</span>
        <small>心と思い出</small>
    </button>

</div>

<div class="custom-idea">

    <div class="custom-idea-title">
        💡 自分のアイデアも追加
    </div>

    <p>
        選んだジャンルに、自分だけのアイデアをプラスできます。
    </p>

    <textarea
    id="customIdea"
    placeholder="例：月に住んでいる猫のおはなし"></textarea>

</div>

<button class="next-button" id="nextButton">
    次へ
</button>

<script src="utils.js"></script>
<script src="script.js"></script>

</body>

</html>
