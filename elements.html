<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoryBloom - 物語の要素</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>✨ このお話には何を入れたい？</h1>

    <p>
        好きなものをいくつでも選んでね
    </p>


    <div class="choices">


        <button class="card">

            <div class="emoji">🗺️</div>

            <span>冒険</span>

            <small>知らない場所へ旅に出る</small>

        </button>


        <button class="card">

            <div class="emoji">🎁</div>

            <span>秘密</span>

            <small>隠された秘密がある</small>

        </button>


        <button class="card">

            <div class="emoji">🌟</div>

            <span>不思議な出来事</span>

            <small>普通では起こらないことが起きる</small>

        </button>


        <button class="card">

            <div class="emoji">🤝</div>

            <span>出会い</span>

            <small>大切な誰かと出会う</small>

        </button>


        <button class="card">

            <div class="emoji">🔥</div>

            <span>挑戦</span>

            <small>困難に立ち向かう</small>

        </button>


        <button class="card">

            <div class="emoji">😂</div>

            <span>楽しい出来事</span>

            <small>笑顔になるハプニング</small>

        </button>


        <button class="card">

            <div class="emoji">💎</div>

            <span>宝物</span>

            <small>大切なものを探す</small>

        </button>


        <button class="card">

            <div class="emoji">🌱</div>

            <span>成長</span>

            <small>主人公が変化する</small>

        </button>


        <button class="card">

            <div class="emoji">😢</div>

            <span>別れ</span>

            <small>大切なものとの別れ</small>

        </button>


        <button class="card">

            <div class="emoji">✨</div>

            <span>奇跡</span>

            <small>信じられない出来事</small>

        </button>


    </div>


    <div class="idea-box">

        <p>💡 自分のアイデアも入れられるよ</p>

        <textarea
            id="elementIdea"
            placeholder="例：空を飛ぶ魚が出てくる"></textarea>

    </div>


    <button class="next-button" id="elementNext">
        次へ
    </button>


    <script src="utils.js"></script>
    <script src="elements.js"></script>

</body>

</html>
