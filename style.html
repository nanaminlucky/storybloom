```html
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoryBloom - 表現方法</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="step-page">

        <div class="step-label">
            STEP 5
        </div>

        <h1>✍️ どんな形で物語を書きたい？</h1>

        <p class="step-description">
            好きなものをいくつでも選んでね
        </p>


        <div class="choices">

            <button class="card">
                <div class="emoji">📖</div>
                <span>小説</span>
                <small>本を読むように、ゆっくり物語を楽しむ</small>
            </button>

            <button class="card">
                <div class="emoji">📚</div>
                <span>絵本</span>
                <small>絵とお話をいっしょに楽しむ</small>
            </button>

            <button class="card">
                <div class="emoji">💌</div>
                <span>書簡体</span>
                <small>手紙を読んでいるように、お話が進む</small>
            </button>

            <button class="card">
                <div class="emoji">📔</div>
                <span>日記</span>
                <small>主人公の日記を読むように、お話を楽しむ</small>
            </button>

            <button class="card">
                <div class="emoji">🪞</div>
                <span>入れ子構造</span>
                <small>お話の中に、もうひとつのお話がある</small>
            </button>

            <button class="card">
                <div class="emoji">🎭</div>
                <span>ナンセンス</span>
                <small>ふしぎな仕掛けがある、ちょっと変わったお話</small>
            </button>

            <button class="card">
                <div class="emoji">🌊</div>
                <span>心の声</span>
                <small>主人公の気持ちや考えを、じっくり読む</small>
            </button>

            <button class="card">
                <div class="emoji">🎵</div>
                <span>詩</span>
                <small>きれいな言葉や、言葉のリズムを楽しむ</small>
            </button>

            <button class="card">
                <div class="emoji">📰</div>
                <span>記事・記録</span>
                <small>新聞や記録を読むように、お話を追っていく</small>
            </button>

            <button class="card">
                <div class="emoji">✨</div>
                <span>おまかせ</span>
                <small>お話にぴったりの形を、StoryBloomが選ぶ</small>
            </button>

        </div>


        <div class="idea-box">

            <p>💡 こんな書き方にしたい！</p>

            <textarea
                id="styleIdea"
                placeholder="例：絵本みたいに、絵と文章が自然に組み合わさる感じにしたい"></textarea>

        </div>


        <div class="step-navigation">

            <button class="next-button" id="styleNext">
                次へ →
            </button>

        </div>

    </main>


    <script src="utils.js"></script>
    <script src="style.js"></script>

</body>

</html>
```
